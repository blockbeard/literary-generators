name: Update blog posts

on:
  repository_dispatch:
    types: [blog-published]
  schedule:
    - cron: '0 7 * * *'   # daily fallback in case the dispatch is missed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/update-blog-posts.mjs
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain index.html)" ]]; then
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m "chore: refresh recent blog posts"
            git push
          else
            echo "index.html unchanged."
          fi
