name: Update blog posts

on:
  push:
    branches: [main]
    paths: ['_data/blog-feed.xml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/update-blog-posts.mjs
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain index.html)" ]]; then
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m "chore: refresh recent blog posts"
            git push
          else
            echo "index.html unchanged."
          fi
